name: Golang CI Lint
# This workflow will run the golangci-lint analysis

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, as in the services that consume this library: 2.15.0 renamed the
          # exhaustive "map" check and rejects this repo's config before linting.
          version: v2.10.1
